apiVersion: v1
kind: Namespace
metadata: {name: build-bot}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: build-bot-api, namespace: build-bot}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: computer-broker, namespace: build-bot}
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: computer-broker, namespace: build-bot}
subjects: [{kind: ServiceAccount, name: build-bot-api, namespace: build-bot}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: computer-broker}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: build-bot}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: build-bot-api, namespace: build-bot}
spec:
  replicas: 2
  selector: {matchLabels: {app: build-bot-api}}
  template:
    metadata: {labels: {app: build-bot-api}}
    spec:
      serviceAccountName: build-bot-api
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: replace.example/build-bot-api:VERSION
          ports: [{name: http, containerPort: 3005}]
          env:
            - {name: COLLEAGUE_ZERO_AI_PROVIDER, value: gemini}
            - {name: GEMINI_API_KEY, valueFrom: {secretKeyRef: {name: build-bot-provider-secrets, key: gemini-api-key}}}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: build-bot-api, namespace: build-bot}
spec: {selector: {app: build-bot-api}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: build-bot-api, namespace: build-bot}
spec: {minAvailable: 1, selector: {matchLabels: {app: build-bot-api}}}
