apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: build-bot
  namespace: build-bot
  annotations:
    cert-manager.io/cluster-issuer: replace-production-issuer
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls: [{hosts: [replace.build-bot.example], secretName: build-bot-tls}]
  rules:
    - host: replace.build-bot.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: build-bot-api, port: {name: http}}}
