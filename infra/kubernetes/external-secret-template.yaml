apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: build-bot-provider-secrets, namespace: build-bot}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: replace-secret-store}
  target: {name: build-bot-provider-secrets, creationPolicy: Owner}
  data:
    - secretKey: gemini-api-key
      remoteRef: {key: replace/build-bot/production, property: gemini_api_key}
    - secretKey: google-service-account-json
      remoteRef: {key: replace/build-bot/production, property: google_service_account_json}
